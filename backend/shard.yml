name: urlku
version: 1.0.0

description: |
  URLKU — Link panjang? Pendekin aja. URL shortener API built with Crystal + Kemal.

authors:
  - URLKU Team

crystal: ">= 1.12.0"

license: MIT

targets:
  urlku:
    main: src/app.cr

dependencies:
  kemal:
    github: kemalcr/kemal
    version: ~> 1.14
  db:
    github: crystal-lang/crystal-db
    version: ~> 0.14
  sqlite3:
    github: crystal-lang/crystal-sqlite3
    version: ~> 0.23
  pg:
    github: will/crystal-pg
    version: ~> 0.30
