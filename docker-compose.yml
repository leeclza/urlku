services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: /app/data/urlku.db
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RATE_LIMIT_CREATE_PER_MINUTE: ${RATE_LIMIT_CREATE_PER_MINUTE:-20}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
      EXPIRED_LINK_RETENTION_DAYS: ${EXPIRED_LINK_RETENTION_DAYS:-30}
      CLICK_RETENTION_DAYS: ${CLICK_RETENTION_DAYS:-365}
    ports:
      - "3000:3000"
    volumes:
      - urlku-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${BASE_URL:-http://localhost:3000}
        VITE_BASE_URL: ${BASE_URL:-http://localhost:3000}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  urlku-data:
